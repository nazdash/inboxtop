name: Check and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan complete history with pinned Gitleaks
        shell: bash
        run: |
          scanner_dir=$(mktemp -d)
          trap 'rm -rf "$scanner_dir"' EXIT
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$scanner_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" git --redact --no-banner --ignore-gitleaks-allow --log-opts=--all .
  verify:
    needs: secrets
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: python3 tests/release-verifier.test.py
      - run: npm run audit:release
      - run: npm run build
      - name: Verify standalone executable and terminal cleanup
        shell: bash
        run: |
          binary=$(find "$PWD/dist" -type f -name inboxtop | head -1)
          "$binary" --version
          "$binary" setup --schema
          INBOXTOP_TEST_BINARY="$binary" npm run test:terminal
      - name: Build optional Mac menu
        if: runner.os == 'macOS'
        shell: bash
        run: |
          binary=$(find "$PWD/dist" -type f -name inboxtop | head -1)
          npm run build:menu -- --standalone "$(dirname "$binary")"
      - name: Verify Linux credential storage in a disposable session
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus gnome-keyring libsecret-tools
          binary=$(find "$PWD/dist" -type f -name inboxtop | head -1)
          npm run test:vault:linux -- "$binary"
      - run: npm run package:release
      - run: npm run verify:release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inboxtop-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
